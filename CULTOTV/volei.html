<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <link rel="stylesheet" href="cultotv.js">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>StreamPlay - Galeria de Vídeos</title>
    <style>
        /* 🎨 PALETA DE CORES (Variáveis CSS) */
        :root {
            --azul-escuro: #0f172a;    /* Fundo principal da página */
            --azul-card: #1e293b;      /* Fundo dos cards e menus */
            --azul-destaque: #2563eb;  /* Azul para detalhes secundários */
            --amarelo: #facc15;        /* Cor de destaque principal (Gols/Botões) */
            --amarelo-hover: #eab308;  /* Tom de hover para o amarelo */
            --branco: #ffffff;         /* Textos principais e títulos */
            --cinza-claro: #cbd5e1;    /* Parágrafos e textos secundários */
        }

        /* Configurações Gerais */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background-color: var(--azul-escuro);
            color: var(--branco);
            min-height: 100vh;
            display: flex;
            flex: column;
            flex-direction: column;
        }

        header {
            background-color: rgba(11, 15, 25, 0.9);
            border-bottom: 1px solid var(--borda);
            top: 0;
            width: 100%;
            z-index: 1000;
            backdrop-filter: blur(10px);
        }

        .nav-container {
            max-width: 1200px;
            margin: 0 auto;
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 15px 20px;
        }

        /* ⚓ HEADER (Barra Superior) */
        header {
            background-color: var(--azul-card);
            border: 2px solid var(--amarelo); /* Linha amarela de assinatura */
            border-bottom: 2px solid var(--amarelo);
            padding: 15px 30px;
            display: flex;
            justify-content: space-between;
            border-radius: 8px;
            align-items: center;
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.3);
        }

        .logo {
            font-size: 24px;
            font-weight: 900;
            color: var(--branco);
            letter-spacing: 1px;
        }

        .logo span {
            color: var(--amarelo);
        }

        .badge-live {
            background-color: #ef4444;
            color: var(--branco);
            font-size: 11px;
            font-weight: bold;
            padding: 4px 10px;
            border-radius: 50px;
            animation: piscar 1.5s infinite;
        }

        /* 📺 LAYOUT PRINCIPAL (Grid de Conteúdo) */
        .container {
            max-width: 1400px;
            width: 100%;
            margin: 30px auto;
            padding: 0 20px;
            display: grid;
            grid-template-columns: 3fr 1fr;
            gap: 30px;
        }

        /* Player em Destaque (Esquerda) */
        .player-principal {
            background-color: var(--azul-card);
            border: 1px; /* Linha amarela de assinatura */
            padding: 15px 30px;
            display: flex;
            justify-content: space-between;
            border-radius: 8px;
            align-items: center;
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.3);
        }

        .player-principal:hover {
            background-color: var(--azul-card);
            border: 1px solid var(--amarelo); /* Linha amarela de assinatura */
            padding: 15px 30px;
            display: flex;
            justify-content: space-between;
            border-radius: 8px;
            align-items: center;
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.3);
        }

        .video-container {
            width: 100%;
            aspect-ratio: 16 / 9; /* Mantém proporção perfeita do YouTube */
            background-color: #000;
            border-radius: 16px;
            overflow: hidden;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.5);
            border: 1px solid rgba(250, 252, 21, 0.1);
        }

        .video-container iframe {
            width: 100%;
            height: 100%;
            border: none;
        }

        .player-info {
            background-color: var(--azul-card);
            padding: 20px;
            border-radius: 16px;
            border-left: 5px solid var(--amarelo); /* Detalhe amarelo no texto */
        }

        .player-info h1 {
            font-size: 24px;
            margin-bottom: 8px;
            color: var(--branco);
        }

        .player-info p {
            color: var(--cinza-claro);
            font-size: 14px;
            line-height: 1.6;
        }

        /* 🗂️ GRID LATERAL DE CARDS (Direita) */
        .playlist-lateral {
            display: flex;
            flex-direction: column;
            gap: 20px;
        }

        .playlist-titulo {
            font-size: 14px;
            text-transform: uppercase;
            letter-spacing: 1px;
            color: var(--amarelo);
            font-weight: bold;
            margin-bottom: 5px;
        }

        /* ESTRUTURA DO CARD */
        .card-video {
            background-color: var(--azul-card);
            border-radius: 12px;
            overflow: hidden;
            border: 1px solid #334155;
            transition: all 0.3s ease;
            display: flex;
            flex-direction: column;
        }

        .card-video:hover {
            transform: translateY(-4px);
            border-color: var(--amarelo);
            box-shadow: 0 8px 20px rgba(250, 204, 21, 0.1);
        }

        /* Miniatura do vídeo */
        .card-thumb {
            width: 100%;
            aspect-ratio: 16 / 9;
            background-color: #000;
            position: relative;
        }

        .card-thumb iframe {
            width: 100%;
            height: 100%;
            border: none;
        }

        /* Conteúdo do Card */
        .card-body {
            padding: 15px;
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        /* Título na Esquerda e Status/Placar na Direita usando FLEX */
        .card-header-flex {
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            gap: 10px;
        }

        .card-titulo {
            font-size: 15px;
            font-weight: bold;
            color: var(--branco);
            line-height: 1.4;
        }

        /* Texto posicionado no canto direito do card */
        .texto-direita {
            color: var(--amarelo);
            font-weight: 800;
            font-size: 16px;
            white-space: nowrap; /* Evita que o placar quebre linha */
        }

        .nav-menu {
            display: flex;
            list-style: none;
            align-items: center;
            gap: 20px;
        }

        .card-descricao {
            font-size: 12px;
            color: var(--cinza-claro);
            line-height: 1.5;
        }

        .btn-assistir {
            background-color: var(--amarelo);
            color: var(--azul-escuro);
            font-weight: bold;
            font-size: 13px;
            padding: 8px 12px;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            transition: background-color 0.2s ease;
            text-align: center;
            text-decoration: none;
            margin-top: 5px;
        }

        .nav-menu a:hover {
            color: var(--azul-neon);
        }

        .nav-menu a {
            color: var(--texto-mutado);
            text-decoration: none;
            font-size: 0.95rem;
            transition: color 0.3s;
        }

        .nav-container {
            max-width: 1200px;
            margin: 0 auto;
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 15px 20px;
        }

        .btn-volta:hover {
            background-color: #725c05;
        }
        .btn-volta:active {
            transform: scale(0.98);
        }

        .btn-volta {      /* Fixa o elemento na tela (não sai do lugar ao rolar) */
            top: 90px;             /* Distância de 20px do topo */
            right: 20px;           /* Distância de 20px da direita */
            z-index: 1000;
        }


        .btn-volta { /* Mantém o botão fixo no canto mesmo ao rolar a página */
            padding: 10px 20px;
            background-color: #facc15;
            color: white;
            border: none;
            border-radius: 12px;
            cursor: pointer;
        }
        .btn-assistir:hover {
            background-color: var(--amarelo-hover);
        }

        /* Animações */
        @keyframes piscar {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.4; }
        }

        /* 📱 RESPONSIVIDADE (Telas menores) */
        @media (max-width: 1024px) {
            .container {
                grid-template-columns: 1fr; /* Transforma em uma única coluna no celular */
            }
        }
    </style>
</head>
